[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bigbro"
version = "1.0.0"
description = "Turn your Mac into a local AI inference server for nearby iOS devices"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Cedric Nagata" }]
keywords = ["mlx", "apple-silicon", "llm", "inference", "bonjour"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The MLX stack is Apple-silicon only and has no Linux wheels. Marking it keeps
# `pip install -e .` working on other platforms for the parts that are pure Python —
# the parsers, catalog, framing and pairing logic all have real tests that do not
# need a GPU. `bigbro serve` still refuses to start off macOS (see daemon.py).
dependencies = [
    "huggingface-hub>=0.27",
    "numpy>=1.26",
    "mlx-lm>=0.28; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-vlm>=0.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-audio>=0.4.6; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # Kokoro phonemizes through misaki. mlx-audio treats it as optional and raises
    # at synthesis time without it — "Speak failed: Kokoro requires the optional
    # misaki package" — which is a runtime failure for a feature bigbro ships, so
    # it is a hard dependency here rather than something a user discovers.
    "misaki[en]>=0.9; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # misaki's English G2P needs a spaCy model, and if it is absent misaki calls
    # `spacy.cli.download` at synthesis time — which shells out to pip and, when
    # that fails, calls sys.exit(2). Declaring it up front means that path is
    # never taken. spaCy models are not on PyPI, hence the direct URL.
    "en-core-web-sm; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

# spaCy models are not published to PyPI, so the wheel is named directly. Kept in
# `tool.uv.sources` rather than inline in `project.dependencies`, which hatchling
# rejects for direct URLs.
[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
bigbro = "bigbro.__main__:main"

[project.urls]
Homepage = "https://github.com/cedricnagata/bigbro"
Client = "https://github.com/cedricnagata/bigbro-kit"

[tool.hatch.build.targets.wheel]
packages = ["src/bigbro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
